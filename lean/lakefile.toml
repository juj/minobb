name = "MinBox"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MinBox"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false # style linters for Mathlib contributions; not needed here
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "MinBox"
